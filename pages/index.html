<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PSL Assignment-1</title>
    <link rel="stylesheet" href="./CSS/style.css" />
    <script type="module" src="./app.js"></script>
  </head>
  <body>
    <h3 id="title">Card Game</h3>
    <div id="name-modal">
      <div id="name-modal-box">
        <h4>Enter Player Names</h4>
        <label for="player1-input">Player 1 Name:</label>
        <input type="text" id="player1-input" />
        <label for="player2-input">Player 2 Name:</label>
        <input type="text" id="player2-input" />
        <input
          type="button"
          id="start-game-button"
          class="btns"
          value="Start Game"
          disabled="disabled"
        />
      </div>
    </div>
    <div class="container" id="game-board" style="display: none">
      <div id="box-1">
        <div id="box-1-1">
          <h5>Player 1</h5>
          <h5 id="name-1">Name:</h5>
        </div>
        <div id="card-1" class="cards">
          <img
            src="./images/back.png"
            id="img-1"
            class="images"
            value="not-revealed"
            alt="back"
          />
        </div>
        <div id="card-2" class="cards">
          <img
            src="./images/back.png"
            id="img-2"
            class="images"
            value="not-revealed"
            alt="back"
          />
        </div>
        <div id="card-3" class="cards">
          <img
            src="./images/back.png"
            id="img-3"
            class="images"
            value="not-revealed"
            alt="back"
          />
        </div>
        <div id="btn">
          <input
            id="button-1"
            type="button"
            class="btns"
            value="Show Highest Card"
            disabled="disabled"
          />
        </div>
        <div id="box-1-2">
          <h5 id="high-title-1">Highest Card</h5>
          <h5 id="points-earned-1">Points Earned</h5>
        </div>
        <div id="box-1-3">
          <div id="high-1">
            <img
              src="./images/blank_card.png"
              id="img-high-1"
              class="images-1"
              value="not-revealed"
              alt="back"
            />
          </div>
          <div id="points-1">0</div>
        </div>
      </div>
      <div id="box-2">
        <div id="box-2-1">
          <h5>Player 2</h5>
          <h5 id="name-2">Name:</h5>
        </div>
        <div id="card-4">
          <img
            src="./images/back.png"
            id="img-4"
            class="images"
            value="not-revealed"
            alt="back"
          />
        </div>
        <div id="card-5">
          <img
            src="./images/back.png"
            id="img-5"
            class="images"
            value="not-revealed"
            alt="back"
          />
        </div>
        <div id="card-6">
          <img
            src="./images/back.png"
            id="img-6"
            class="images"
            value="not-revealed"
            alt="back"
          />
        </div>
        <div id="btn-2">
          <input
            id="button-2"
            type="button"
            class="btns"
            disabled="disabled"
            value="Show Highest Card"
          />
        </div>
        <div id="box-2-2">
          <h5 id="high-title-2">Highest Card</h5>
          <h5 id="points-earned-2">Points Earned</h5>
        </div>
        <div id="box-2-3">
          <div id="high-2">
            <img
              src="./images/blank_card.png"
              id="img-high-2"
              class="images-1"
              value="not-revealed"
              alt="back"
            />
          </div>
          <div id="points-2">0</div>
        </div>
      </div>
    </div>
    <div id="final" style="display: none">
      <input
        id="final-button"
        type="button"
        class="btns"
        disabled="disabled"
        value="Decide Winner"
      />
      <div id="win-row">
        <h5 id="win"></h5>
        <h5 id="score"></h5>
        <input
          id="new-game-button"
          type="button"
          class="btns"
          value="Start New Game"
          style="display: none"
        />
      </div>
    </div>
  </body>
</html>
